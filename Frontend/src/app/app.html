<main class="calculadora">
  <header>
    <span class="etiqueta">10 fórmulas esenciales</span>
    <h1>Calculadora de fórmulas</h1>
    <p>Selecciona una fórmula, ingresa los datos y calcula.</p>
  </header>

  <label for="formula">¿Qué deseas calcular?</label>
  <select id="formula" [(ngModel)]="formula" (ngModelChange)="limpiar()">
    <option *ngFor="let opcion of formulas" [ngValue]="opcion">
      {{ opcion.nombre }}
    </option>
  </select>

  <p class="expresion">{{ formula.expresion }}</p>

  <form (ngSubmit)="calcular()">
    <div class="campo" *ngFor="let campo of formula.campos; let i = index">
      <label [for]="'dato' + i">{{ campo }}</label>
      <input type="number" step="any" placeholder="Ingresa un valor"
        [id]="'dato' + i" [name]="'dato' + i"
        [(ngModel)]="valores[i]" (ngModelChange)="borrarResultado()">
    </div>

    <div class="botones">
      <button type="submit">Calcular</button>
      <button type="button" class="secundario" (click)="limpiar()">Limpiar</button>
    </div>
  </form>

  <p class="error" role="alert" *ngIf="error">{{ error }}</p>

  <div class="resultado" aria-live="polite">
    <span>Resultado</span>
    <strong *ngIf="resultado !== null; else pendiente">
      {{ resultado | number:'1.0-4' }} {{ formula.unidad }}
    </strong>
    <ng-template #pendiente>
      <strong>—</strong>
    </ng-template>
  </div>
</main>
